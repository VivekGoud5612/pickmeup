[project]
name = "pickmeup"
version = "0.1.0"
description = "A simple hero game"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    # Backend
    "fastapi>=0.136.1",
    "uvicorn[standard]>=0.46.0",

    # RL / ML
    "gymnasium>=1.3.0",
    "numpy>=2.4.4",
    "torch>=2.12.0",
    "tensorboard>=2.20.0",

    # Redis
    "redis>=8.0.1",

    # Database
    "sqlalchemy>=2.0.44",
    "psycopg[binary]>=3.2.10",
    "alembic>=1.16.5",

    # Validation
    "pydantic>=2.11.7",
    "pydantic-settings>=2.10.1",

    # Utilities
    "python-dotenv>=1.1.1",
]

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "pytest-mock>=3.14.1",
    "httpx>=0.28.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]