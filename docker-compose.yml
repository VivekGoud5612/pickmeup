services:

  backend:
    build: .
    container_name: pickmeup-backend
    ports:
      - "8000:8000"

  redis:
    image: redis:latest
    container_name: redis
    ports:
      - "6379:6379"

  gateway:
    build: ./node-gateway
    container_name: pickmeup-gateway
    ports:
      - "3001:3001"
    depends_on:
      - redis

  frontend:
    build: ./frontend
    container_name: pickmeup-frontend
    ports:
      - "5173:5173"
    depends_on:
      - gateway
      - backend